<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - guardar en sesión</title>
    <style>
        body   { font-family: Arial, Helvetica, sans-serif; margin: 40px; }
        label  { display: block; margin-top: 12px; font-weight: bold; }
        input  { padding: 6px; width: 260px; }
        button { margin-top: 20px; padding: 8px 20px; cursor: pointer; }
        fieldset { max-width: 380px; }
    </style>
</head>
<body>

    <h1>Formulario de registro (se guardará en sesión)</h1>

    <!--
        Ejercicio propuesto (Session)
        ------------------------------------------------------------
        Dado el ejercicio anterior (formulario de registro), almacenar los
        datos ingresados en el formulario en sesión (no olvidar hacer el
        session_start()) y luego hacer un var_dump($_SESSION) en el archivo
        formulario_session.php (tampoco olvidar el session_start() ahí).

        Flujo de este ejercicio:
        formulario.html -> guardar_session.php (guarda en $_SESSION)
                        -> formulario_session.php (var_dump de $_SESSION)
    -->
    <form action="guardar_session.php" method="POST" name="registro">
        <fieldset>
            <legend>Datos del usuario</legend>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="confirmar_password">Confirmar password</label>
            <input type="password" id="confirmar_password" name="confirmar_password" required>

            <button type="submit">Registrarme</button>
        </fieldset>
    </form>

</body>
</html>
